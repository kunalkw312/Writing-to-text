<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UPSC Daily Current Affairs Aggregator</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Phosphor Icons CDN -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen flex flex-col antialiased">

  <!-- Header -->
  <header class="bg-indigo-900 text-white sticky top-0 z-40 shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="bg-amber-400 text-indigo-950 p-2 rounded-lg font-bold">
          <i class="ph ph-newspaper text-xl"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold leading-none tracking-tight">UPSC Current Affairs Hub</h1>
          <p class="text-xs text-indigo-200 mt-1" id="current-date">Daily UPSC Prelims & Mains Aggregator</p>
        </div>
      </div>
      
      <div class="flex items-center gap-2">
        <button id="refresh-btn" onclick="fetchFeeds()" class="p-2 text-indigo-200 hover:text-white hover:bg-indigo-800 rounded-lg transition" title="Refresh Feeds">
          <i class="ph ph-arrows-clockwise text-xl"></i>
        </button>
        <button onclick="toggleBookmarksView()" class="relative p-2 text-indigo-200 hover:text-white hover:bg-indigo-800 rounded-lg transition" title="Saved Notes">
          <i class="ph ph-bookmark-simple text-xl"></i>
          <span id="bookmark-count" class="hidden absolute top-1 right-1 bg-amber-400 text-indigo-950 text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center">0</span>
        </button>
      </div>
    </div>

    <!-- Search & Filters Bar -->
    <div class="bg-indigo-950/80 px-4 py-3 border-t border-indigo-800/50">
      <div class="max-w-6xl mx-auto flex flex-col md:flex-row gap-3 items-center justify-between">
        <!-- Search Input -->
        <div class="relative w-full md:w-80 flex-shrink-0">
          <i class="ph ph-magnifying-glass absolute left-3 top-2.5 text-indigo-300"></i>
          <input 
            type="text" 
            id="search-input" 
            placeholder="Search keywords (e.g. RBI, ISRO, GS-2)..." 
            oninput="handleSearch(this.value)"
            class="w-full pl-9 pr-4 py-1.5 text-sm rounded-lg bg-indigo-900/60 text-white placeholder-indigo-300 border border-indigo-700 focus:outline-none focus:ring-2 focus:ring-amber-400"
          />
        </div>

        <!-- Filter Pills -->
        <div class="flex items-center gap-1.5 overflow-x-auto w-full pb-1 md:pb-0 text-xs font-medium hide-scrollbar">
          <button class="filter-btn px-3 py-1.5 rounded-full bg-amber-400 text-indigo-950 whitespace-nowrap font-semibold" data-filter="all" onclick="setFilter('all', this)">All News</button>
          <button class="filter-btn px-3 py-1.5 rounded-full bg-indigo-800/70 text-indigo-200 hover:bg-indigo-800 whitespace-nowrap" data-filter="The Hindu" onclick="setFilter('The Hindu', this)">The Hindu</button>
          <button class="filter-btn px-3 py-1.5 rounded-full bg-indigo-800/70 text-indigo-200 hover:bg-indigo-800 whitespace-nowrap" data-filter="Editorial" onclick="setFilter('Editorial', this)">Editorials</button>
          <button class="filter-btn px-3 py-1.5 rounded-full bg-indigo-800/70 text-indigo-200 hover:bg-indigo-800 whitespace-nowrap" data-filter="Opinion" onclick="setFilter('Opinion', this)">Opinions</button>
          <button class="filter-btn px-3 py-1.5 rounded-full bg-indigo-800/70 text-indigo-200 hover:bg-indigo-800 whitespace-nowrap" data-filter="Explained" onclick="setFilter('Explained', this)">Explained</button>
          <button class="filter-btn px-3 py-1.5 rounded-full bg-indigo-800/70 text-indigo-200 hover:bg-indigo-800 whitespace-nowrap" data-filter="Science" onclick="setFilter('Science', this)">Science</button>
          <button class="filter-btn px-3 py-1.5 rounded-full bg-indigo-800/70 text-indigo-200 hover:bg-indigo-800 whitespace-nowrap" data-filter="World" onclick="setFilter('World', this)">World (IR)</button>
          <button class="filter-btn px-3 py-1.5 rounded-full bg-indigo-800/70 text-indigo-200 hover:bg-indigo-800 whitespace-nowrap" data-filter="PIB" onclick="setFilter('PIB', this)">PIB</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-6xl mx-auto px-4 py-6 flex-grow w-full">
    <!-- Active Status / Ticker -->
    <div id="status-bar" class="mb-4 text-xs font-semibold uppercase tracking-wider text-slate-500 flex items-center justify-between">
      <span id="active-feed-label">Showing Latest Articles</span>
      <span id="items-count" class="text-slate-400 font-normal">Loading...</span>
    </div>

    <!-- Feed Cards Grid -->
    <div id="news-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
      <!-- Loading Skeletons -->
      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm animate-pulse space-y-3">
        <div class="h-4 bg-slate-200 rounded w-1/3"></div>
        <div class="h-6 bg-slate-200 rounded w-3/4"></div>
        <div class="h-16 bg-slate-100 rounded"></div>
      </div>
      <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm animate-pulse space-y-3">
        <div class="h-4 bg-slate-200 rounded w-1/3"></div>
        <div class="h-6 bg-slate-200 rounded w-3/4"></div>
        <div class="h-16 bg-slate-100 rounded"></div>
      </div>
    </div>

    <!-- Empty State -->
    <div id="empty-state" class="hidden text-center py-16">
      <i class="ph ph-newspaper-clipping text-5xl text-slate-300 mb-2"></i>
      <h3 class="text-base font-semibold text-slate-700">No articles found</h3>
      <p class="text-sm text-slate-500 mt-1">Try modifying your search or select a different category.</p>
    </div>
  </main>

  <!-- Reader / Summary Modal -->
  <div id="article-modal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-2xl w-full max-h-[85vh] flex flex-col shadow-2xl overflow-hidden animate-in fade-in zoom-in-95 duration-150">
      <div class="p-4 border-b border-slate-100 flex items-center justify-between bg-slate-50">
        <div class="flex items-center gap-2">
          <span id="modal-syllabus" class="text-xs font-semibold px-2 py-0.5 rounded bg-indigo-100 text-indigo-800">GS</span>
          <span id="modal-source" class="text-xs font-medium text-slate-500">Source</span>
        </div>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-700 p-1 rounded-lg">
          <i class="ph ph-x text-lg"></i>
        </button>
      </div>

      <div class="p-6 overflow-y-auto space-y-4">
        <h2 id="modal-title" class="text-xl font-bold text-slate-900 leading-snug"></h2>
        <div class="flex items-center gap-2 text-xs text-slate-400" id="modal-date"></div>
        <div id="modal-content" class="text-sm text-slate-700 leading-relaxed space-y-3 border-t border-slate-100 pt-4"></div>
      </div>

      <div class="p-4 border-t border-slate-100 flex items-center justify-between bg-slate-50">
        <button id="modal-bookmark-btn" class="flex items-center gap-1.5 text-xs font-semibold px-3 py-2 rounded-lg border border-slate-300 hover:bg-slate-100 text-slate-700">
          <i class="ph ph-bookmark-simple"></i>
          <span>Save for Revision</span>
        </button>
        <a id="modal-external-link" href="#" target="_blank" rel="noopener noreferrer" class="flex items-center gap-1 text-xs font-semibold px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white">
          Read Original Web Source <i class="ph ph-arrow-square-out"></i>
        </a>
      </div>
    </div>
  </div>

  <script>
    // Configuration of standard UPSC-relevant feeds (Added Editorial, Science, Opinion, World)
    const FEEDS = [
      {
        source: 'The Hindu',
        category: 'The Hindu',
        url: 'https://www.thehindu.com/news/national/feeder/default.rss'
      },
      {
        source: 'The Hindu Editorial',
        category: 'Editorial',
        url: 'https://www.thehindu.com/opinion/editorial/feeder/default.rss'
      },
      {
        source: 'Indian Express',
        category: 'Opinion',
        url: 'https://indianexpress.com/section/opinion/feed/'
      },
      {
        source: 'Indian Express',
        category: 'Explained',
        url: 'https://indianexpress.com/section/explained/feed/'
      },
      {
        source: 'The Hindu Science',
        category: 'Science',
        url: 'https://www.thehindu.com/sci-tech/science/feeder/default.rss'
      },
      {
        source: 'The Hindu World',
        category: 'World',
        url: 'https://www.thehindu.com/news/international/feeder/default.rss'
      },
      {
        source: 'Press Information Bureau',
        category: 'PIB',
        url: 'https://archive.pib.gov.in/rss/pib_pressrelease.aspx'
      }
    ];

    // Fallback Data for robustness
    const FALLBACK_NEWS = [
      {
        id: "fb-1",
        title: "Supreme Court Clarifies Delimitation & Federal Representation Principles",
        link: "https://www.thehindu.com",
        pubDate: new Date().toLocaleDateString('en-IN', { month: 'short', day: 'numeric', year: 'numeric' }),
        source: "The Hindu",
        category: "The Hindu",
        syllabus: "GS-2: Indian Constitution & Federalism",
        description: "A Constitution Bench detailed the balance between population-based seat allocation and protecting the parliamentary representation of states that successfully stabilized population growth."
      },
      {
        id: "fb-2",
        title: "The shifting sands of multipolarity in the Middle East",
        link: "https://www.thehindu.com/opinion/editorial/",
        pubDate: new Date().toLocaleDateString('en-IN', { month: 'short', day: 'numeric', year: 'numeric' }),
        source: "The Hindu Editorial",
        category: "Editorial",
        syllabus: "GS-2: International Relations",
        description: "An editorial analysis of how regional powers are asserting autonomy in the Middle East, bypassing traditional Western hegemony to establish new trade and diplomatic corridors."
      },
      {
        id: "fb-3",
        title: "CRISPR-Cas9: New advancements in treating sickle cell anemia",
        link: "https://www.thehindu.com/sci-tech/science/",
        pubDate: new Date().toLocaleDateString('en-IN', { month: 'short', day: 'numeric', year: 'numeric' }),
        source: "The Hindu Science",
        category: "Science",
        syllabus: "GS-3: Science & Tech",
        description: "Researchers have achieved a breakthrough using CRISPR-Cas9 gene editing to successfully modify stem cells, providing a potential cure for genetic blood disorders."
      },
      {
        id: "fb-4",
        title: "UN Climate Summit: Global South demands equitable transition funds",
        link: "https://www.thehindu.com/news/international/",
        pubDate: new Date().toLocaleDateString('en-IN', { month: 'short', day: 'numeric', year: 'numeric' }),
        source: "The Hindu World",
        category: "World",
        syllabus: "GS-3: Environment / GS-2: IR",
        description: "At the latest COP summit, developing nations united to demand the operationalization of the Loss and Damage fund, citing historical emissions by developed countries."
      }
    ];

    let allArticles = [];
    let currentFilter = 'all';
    let searchQuery = '';
    let bookmarks = JSON.parse(localStorage.getItem('upsc_bookmarks') || '[]');

    // Automatically Tag Syllabus based on Keywords
    function detectSyllabus(title, desc) {
      const text = `${title} ${desc}`.toLowerCase();
      if (text.match(/international|world|diplomacy|foreign|un|who|wto|bilateral|treaty|border|global/)) return "GS-2: International Relations";
      if (text.match(/science|technology|space|isro|nasa|health|disease|medical|gene|ai/)) return "GS-3: Science & Tech";
      if (text.match(/polity|constitution|court|judiciary|bill|parliament|governance|federal|rights/)) return "GS-2: Polity & Governance";
      if (text.match(/economy|rbi|gdp|inflation|fiscal|trade|budget|banking|rupee|tax/)) return "GS-3: Economy";
      if (text.match(/climate|environment|wildlife|biodiversity|energy|pollution|emission/)) return "GS-3: Environment";
      if (text.match(/heritage|culture|art|history|monument|unesco/)) return "GS-1: Art & History";
      if (text.match(/security|defence|cyber|army|navy|terrorism|naxal/)) return "GS-3: Internal Security";
      if (text.match(/society|women|poverty|population|education/)) return "GS-1: Indian Society";
      if (text.match(/editorial|opinion|analysis/)) return "Mains Analysis";
      return "Prelims / General Issues";
    }

    // Clean HTML strings from RSS summary
    function stripHtml(html) {
      const doc = new DOMParser().parseFromString(html, 'text/html');
      return doc.body.textContent || "";
    }

    // Fetch RSS via rss2json API
    async function fetchFeeds() {
      const refreshBtn = document.getElementById('refresh-btn');
      refreshBtn.classList.add('animate-spin');
      
      let fetchedArticles = [];
      const fetchPromises = FEEDS.map(async (feed) => {
        try {
          const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feed.url)}`);
          if (!res.ok) throw new Error('Network issue');
          const data = await res.json();
          if (data && data.items) {
            return data.items.map((item, idx) => ({
              id: `${feed.category}-${idx}-${Date.parse(item.pubDate) || Math.random()}`,
              title: item.title,
              link: item.link,
              pubDate: new Date(item.pubDate).toLocaleDateString('en-IN', { month: 'short', day: 'numeric', year: 'numeric' }),
              source: feed.source,
              category: feed.category,
              syllabus: detectSyllabus(item.title, item.description || feed.category),
              description: stripHtml(item.description || item.content || 'Click below to read full article.')
            }));
          }
          return [];
        } catch (err) {
          console.warn(`Could not load live feed for ${feed.source}:`, err);
          return [];
        }
      });

      const results = await Promise.all(fetchPromises);
      fetchedArticles = results.flat();

      if (fetchedArticles.length === 0) {
        allArticles = FALLBACK_NEWS;
      } else {
        // Remove duplicates by title to ensure clean feeds
        const uniqueArticles = [];
        const seenTitles = new Set();
        [...fetchedArticles, ...FALLBACK_NEWS].forEach(item => {
          if(!seenTitles.has(item.title)){
             seenTitles.add(item.title);
             uniqueArticles.push(item);
          }
        });
        allArticles = uniqueArticles;
      }

      // Sort by recency (most recent first) generally happens naturally via feed, but can be forced if needed.
      refreshBtn.classList.remove('animate-spin');
      render();
    }

    // Render Articles
    function render() {
      const grid = document.getElementById('news-grid');
      const empty = document.getElementById('empty-state');
      const countLabel = document.getElementById('items-count');

      // Filter articles
      let filtered = allArticles.filter(item => {
        const matchesCategory = 
          currentFilter === 'all' ? true :
          currentFilter === 'bookmarks' ? bookmarks.some(b => b.id === item.id) :
          item.category === currentFilter;

        const matchesSearch = 
          item.title.toLowerCase().includes(searchQuery) ||
          item.description.toLowerCase().includes(searchQuery) ||
          item.syllabus.toLowerCase().includes(searchQuery);

        return matchesCategory && matchesSearch;
      });

      countLabel.textContent = `${filtered.length} item(s)`;

      if (filtered.length === 0) {
        grid.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }

      empty.classList.add('hidden');
      grid.innerHTML = filtered.map(item => {
        const isBookmarked = bookmarks.some(b => b.id === item.id);
        return `
          <div class="bg-white rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition flex flex-col justify-between p-5">
            <div>
              <div class="flex items-center justify-between gap-2 mb-2">
                <span class="text-[11px] font-semibold uppercase tracking-wider px-2 py-0.5 rounded bg-indigo-50 text-indigo-700 border border-indigo-100">
                  ${item.source}
                </span>
                <span class="text-[11px] font-medium text-amber-700 bg-amber-50 px-2 py-0.5 rounded border border-amber-200/50 text-right">
                  ${item.syllabus}
                </span>
              </div>
              <h2 class="text-base font-bold text-slate-800 line-clamp-2 hover:text-indigo-600 transition cursor-pointer" onclick='openModal(${JSON.stringify(item).replace(/'/g, "&apos;")})'>
                ${item.title}
              </h2>
              <p class="text-xs text-slate-500 mt-2 line-clamp-3 leading-relaxed">
                ${item.description}
              </p>
            </div>
            
            <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between text-xs text-slate-400">
              <span class="flex items-center gap-1"><i class="ph ph-calendar-blank"></i> ${item.pubDate}</span>
              <div class="flex items-center gap-1">
                <button onclick='toggleBookmark(${JSON.stringify(item).replace(/'/g, "&apos;")})' class="p-1.5 rounded-lg hover:bg-slate-100 ${isBookmarked ? 'text-amber-500 font-bold' : 'text-slate-400'}" title="Save Article">
                  <i class="ph-fill ph-bookmark text-base ${isBookmarked ? 'inline' : 'hidden'}"></i>
                  <i class="ph ph-bookmark text-base ${isBookmarked ? 'hidden' : 'inline'}"></i>
                </button>
                <button onclick='openModal(${JSON.stringify(item).replace(/'/g, "&apos;")})' class="px-2.5 py-1 bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 text-slate-700 font-medium rounded-md transition text-xs">
                  Read
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');

      updateBookmarkBadge();
    }

    // Modal Handling
    let activeModalItem = null;
    function openModal(item) {
      activeModalItem = item;
      document.getElementById('modal-title').textContent = item.title;
      document.getElementById('modal-source').textContent = item.source;
      document.getElementById('modal-syllabus').textContent = item.syllabus;
      document.getElementById('modal-date').innerHTML = `<i class="ph ph-calendar"></i> ${item.pubDate}`;
      document.getElementById('modal-content').textContent = item.description;
      document.getElementById('modal-external-link').href = item.link;

      const isBookmarked = bookmarks.some(b => b.id === item.id);
      const bBtn = document.getElementById('modal-bookmark-btn');
      bBtn.onclick = () => {
        toggleBookmark(item);
        openModal(item); // re-render modal state
      };
      bBtn.innerHTML = isBookmarked ? 
        `<i class="ph-fill ph-bookmark text-amber-500"></i> Saved` : 
        `<i class="ph ph-bookmark"></i> Save for Revision`;

      document.getElementById('article-modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('article-modal').classList.add('hidden');
    }

    // Search and Filters
    function handleSearch(query) {
      searchQuery = query.toLowerCase().trim();
      render();
    }

    function setFilter(filter, el) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.className = "filter-btn px-3 py-1.5 rounded-full bg-indigo-800/70 text-indigo-200 hover:bg-indigo-800 whitespace-nowrap";
      });
      el.className = "filter-btn px-3 py-1.5 rounded-full bg-amber-400 text-indigo-950 whitespace-nowrap font-semibold";
      
      document.getElementById('active-feed-label').textContent = 
        filter === 'all' ? 'All Daily Feeds' : 
        filter === 'bookmarks' ? 'Your Saved Revision List' : `${filter} Feed`;
      render();
    }

    function toggleBookmarksView() {
      const bookmarkBtn = document.querySelector('[data-filter="bookmarks"]');
      if (bookmarkBtn) {
        setFilter('bookmarks', bookmarkBtn);
      } else {
        // If they click the icon without the pill being visible, reset styling and filter
        currentFilter = 'bookmarks';
        document.querySelectorAll('.filter-btn').forEach(btn => {
          btn.className = "filter-btn px-3 py-1.5 rounded-full bg-indigo-800/70 text-indigo-200 hover:bg-indigo-800 whitespace-nowrap";
        });
        document.getElementById('active-feed-label').textContent = 'Your Saved Revision List';
        render();
      }
    }

    // Bookmark Persistence
    function toggleBookmark(item) {
      const index = bookmarks.findIndex(b => b.id === item.id);
      if (index > -1) {
        bookmarks.splice(index, 1);
      } else {
        bookmarks.push(item);
      }
      localStorage.setItem('upsc_bookmarks', JSON.stringify(bookmarks));
      render();
    }

    function updateBookmarkBadge() {
      const badge = document.getElementById('bookmark-count');
      if (bookmarks.length > 0) {
        badge.classList.remove('hidden');
        badge.textContent = bookmarks.length;
      } else {
        badge.classList.add('hidden');
      }
    }

    // Set today's date on header
    document.getElementById('current-date').textContent = new Date().toLocaleDateString('en-IN', {
      weekday: 'long',
      year: 'numeric',
      month: 'long',
      day: 'numeric'
    });

    // Close modal on Escape or outside click
    window.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
    document.getElementById('article-modal').addEventListener('click', (e) => {
      if (e.target.id === 'article-modal') closeModal();
    });

    // Initial load
    fetchFeeds();
  </script>
</body>
</html>
