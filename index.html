<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smartboard - In-Place Handwriting to Text</title>
    <style>
        :root {
            --primary: #4361ee;
            --primary-hover: #3a56d4;
            --danger: #ef476f;
            --danger-hover: #d6335c;
            --bg: #1e1e2f;
            --panel: #2b2b40;
            --text: #ffffff;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 16px;
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Devanagari", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 1000px;
            margin-bottom: 12px;
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        select, button {
            outline: none;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: var(--panel);
            color: #ffffff;
            padding: 8px 16px;
            font-size: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        select:focus, button:focus {
            border-color: var(--primary);
        }

        button.btn-clear {
            background-color: var(--danger);
            border: none;
        }
        button.btn-clear:hover {
            background-color: var(--danger-hover);
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #a0aec0;
        }

        .indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #06d6a0;
        }

        .indicator.busy {
            background-color: #ffd166;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.7; }
            100% { transform: scale(1.3); opacity: 1; }
        }

        #boardContainer {
            position: relative;
            width: 100%;
            max-width: 1000px;
            height: 600px;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            touch-action: none;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        /* Stroke Canvas is where ink is drawn */
        #strokeCanvas {
            z-index: 2;
        }

        /* Text Canvas holds recognized digital characters */
        #textCanvas {
            z-index: 1;
        }

        .footer-note {
            margin-top: 10px;
            font-size: 13px;
            color: #8d99ae;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <div class="controls">
            <label for="langSelect" style="font-weight: 600;">Language:</label>
            <select id="langSelect">
                <option value="mr">Marathi (मराठी)</option>
                <option value="hi">Hindi (हिन्दी)</option>
                <option value="en">English</option>
                <option value="gu">Gujarati (ગુજરાતી)</option>
                <option value="bn">Bengali (বাংলা)</option>
                <option value="ta">Tamil (தமிழ்)</option>
                <option value="te">Telugu (తెలుగు)</option>
                <option value="kn">Kannada (ಕನ್ನಡ)</option>
                <option value="ml">Malayalam (മലയാളം)</option>
                <option value="pa">Punjabi (ਪੰਜਾਬੀ)</option>
                <option value="ur">Urdu (اُردُو)</option>
            </select>
            <button id="clearBtn" class="btn-clear">Clear Board</button>
            <button id="undoBtn">Undo</button>
        </div>
        <div class="status-pill">
            <div id="statusDot" class="indicator"></div>
            <span id="statusText">Ready</span>
        </div>
    </header>

    <div id="boardContainer">
        <!-- Layer 1: Permanent converted text layer -->
        <canvas id="textCanvas"></canvas>
        <!-- Layer 2: Real-time pen stroke ink layer -->
        <canvas id="strokeCanvas"></canvas>
    </div>

    <div class="footer-note">
        Write anywhere on the smartboard. When you finish a word and pause for 1 second, it will transform into crisp typed text at the exact same location and scale.
    </div>

    <script>
        const container = document.getElementById('boardContainer');
        const strokeCanvas = document.getElementById('strokeCanvas');
        const textCanvas = document.getElementById('textCanvas');
        const strokeCtx = strokeCanvas.getContext('2d');
        const textCtx = textCanvas.getContext('2d');

        const langSelect = document.getElementById('langSelect');
        const clearBtn = document.getElementById('clearBtn');
        const undoBtn = document.getElementById('undoBtn');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        let isDrawing = false;
        let strokeTimer = null;
        const RECOGNIZE_DELAY_MS = 1000; // Trigger conversion 1s after pen lift

        // Stroke data structures for handwriting model
        // Format required by engine: [ [x_coords], [y_coords], [times] ]
        let currentStrokeX = [];
        let currentStrokeY = [];
        let currentStrokeT = [];
        let allStrokes = [];
        let strokeStartTime = 0;

        // Bounding box tracking for the active written word
        let bounds = null;

        // Text layer history for undo
        let textHistory = [];

        function resizeCanvases() {
            const rect = container.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;

            // Preserve existing text content through resize
            const tempImg = textCtx.getImageData(0, 0, textCanvas.width, textCanvas.height);

            strokeCanvas.width = rect.width * dpr;
            strokeCanvas.height = rect.height * dpr;
            textCanvas.width = rect.width * dpr;
            textCanvas.height = rect.height * dpr;

            strokeCtx.scale(dpr, dpr);
            textCtx.scale(dpr, dpr);

            saveTextState();
        }

        window.addEventListener('resize', resizeCanvases);

        // Styling for ink pen
        function setPenStyle() {
            strokeCtx.strokeStyle = '#1d3557';
            strokeCtx.lineWidth = 3.5;
            strokeCtx.lineCap = 'round';
            strokeCtx.lineJoin = 'round';
        }

        // Pointer event position extraction
        function getPos(e) {
            const rect = strokeCanvas.getBoundingClientRect();
            return {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };
        }

        function updateBounds(x, y) {
            if (!bounds) {
                bounds = { minX: x, minY: y, maxX: x, maxY: y };
            } else {
                bounds.minX = Math.min(bounds.minX, x);
                bounds.minY = Math.min(bounds.minY, y);
                bounds.maxX = Math.max(bounds.maxX, x);
                bounds.maxY = Math.max(bounds.maxY, y);
            }
        }

        function handlePointerDown(e) {
            clearTimeout(strokeTimer);
            isDrawing = true;

            const pos = getPos(e);
            strokeStartTime = Date.now();

            currentStrokeX = [Math.round(pos.x)];
            currentStrokeY = [Math.round(pos.y)];
            currentStrokeT = [0];

            updateBounds(pos.x, pos.y);

            setPenStyle();
            strokeCtx.beginPath();
            strokeCtx.moveTo(pos.x, pos.y);
        }

        function handlePointerMove(e) {
            if (!isDrawing) return;
            const pos = getPos(e);

            currentStrokeX.push(Math.round(pos.x));
            currentStrokeY.push(Math.round(pos.y));
            currentStrokeT.push(Date.now() - strokeStartTime);

            updateBounds(pos.x, pos.y);

            strokeCtx.lineTo(pos.x, pos.y);
            strokeCtx.stroke();
        }

        function handlePointerUp() {
            if (!isDrawing) return;
            isDrawing = false;

            if (currentStrokeX.length > 0) {
                allStrokes.push([currentStrokeX, currentStrokeY, currentStrokeT]);
            }

            // Schedule recognition once user pauses
            clearTimeout(strokeTimer);
            strokeTimer = setTimeout(processHandwriting, RECOGNIZE_DELAY_MS);
        }

        // Attach touch and stylus listeners with PointerEvents API
        strokeCanvas.addEventListener('pointerdown', handlePointerDown);
        strokeCanvas.addEventListener('pointermove', handlePointerMove);
        strokeCanvas.addEventListener('pointerup', handlePointerUp);
        strokeCanvas.addEventListener('pointercancel', handlePointerUp);
        strokeCanvas.addEventListener('pointerleave', handlePointerUp);

        function saveTextState() {
            textHistory.push(textCtx.getImageData(0, 0, textCanvas.width, textCanvas.height));
            if (textHistory.length > 20) textHistory.shift();
        }

        undoBtn.addEventListener('click', () => {
            if (textHistory.length > 1) {
                textHistory.pop(); // discard current
                const previous = textHistory[textHistory.length - 1];
                textCtx.putImageData(previous, 0, 0);
            } else if (textHistory.length === 1) {
                textCtx.clearRect(0, 0, textCanvas.width, textCanvas.height);
                textHistory = [];
            }
        });

        clearBtn.addEventListener('click', () => {
            clearTimeout(strokeTimer);
            strokeCtx.clearRect(0, 0, strokeCanvas.width, strokeCanvas.height);
            textCtx.clearRect(0, 0, textCanvas.width, textCanvas.height);
            allStrokes = [];
            bounds = null;
            textHistory = [];
            saveTextState();
        });

        // Online stroke handwriting recognition engine
        async function processHandwriting() {
            if (allStrokes.length === 0 || !bounds) return;

            // Capture target geometry before state reset
            const targetBounds = { ...bounds };
            const strokesToSend = [...allStrokes];

            // Reset buffers so the user can start a new word immediately
            allStrokes = [];
            bounds = null;

            statusDot.classList.add('busy');
            statusText.innerText = 'Converting...';

            const rect = strokeCanvas.getBoundingClientRect();
            const payload = {
                app_version: 0.4,
                api_level: "533.0.0",
                device: "5.0 (Windows)",
                input_type: 0,
                options: "enable_pre_space",
                requests: [{
                    writing_guide: {
                        writing_area: {
                            width: Math.round(rect.width),
                            height: Math.round(rect.height)
                        }
                    },
                    pre_context: "",
                    max_num_results: 1,
                    max_completions: 0,
                    language: langSelect.value,
                    ink: strokesToSend
                }]
            };

            try {
                const response = await fetch("https://www.google.com/inputtools/request?ime=handwriting&app=mobilesearch&cs=1&oe=UTF-8", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (data && data[0] === "SUCCESS" && data[1][0][1] && data[1][0][1].length > 0) {
                    const convertedWord = data[1][0][1][0];
                    renderConvertedText(convertedWord, targetBounds);
                } else {
                    console.warn("No match found for written input.");
                }
            } catch (err) {
                console.error("Handwriting recognition network failed:", err);
            } finally {
                // Clear the ink layer completely (converted text now resides on textCanvas)
                strokeCtx.clearRect(0, 0, strokeCanvas.width, strokeCanvas.height);
                statusDot.classList.remove('busy');
                statusText.innerText = 'Ready';
            }
        }

        function renderConvertedText(text, box) {
            const strokeHeight = Math.max(22, box.maxY - box.minY);
            const strokeWidth = Math.max(20, box.maxX - box.minX);

            // Dynamically calculate font size proportional to hand-drawn size
            let fontSize = Math.round(strokeHeight * 0.9);
            const fontFamily = '-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Devanagari", sans-serif';

            textCtx.save();
            textCtx.font = `600 ${fontSize}px ${fontFamily}`;
            textCtx.fillStyle = '#111827';
            textCtx.textBaseline = 'top';

            // Scale down if the typed word width exceeds drawing width significantly
            let measured = textCtx.measureText(text);
            if (measured.width > strokeWidth * 1.5 && fontSize > 16) {
                fontSize = Math.round(fontSize * (strokeWidth / measured.width) * 1.15);
                textCtx.font = `600 ${fontSize}px ${fontFamily}`;
            }

            // Draw typed text exactly where the handwriting was
            textCtx.fillText(text, box.minX, box.minY);
            textCtx.restore();

            saveTextState();
        }

        // Initialize display sizes and history
        resizeCanvases();
        setPenStyle();
    </script>
</body>
</html>
